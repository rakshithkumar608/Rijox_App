name: rijox
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.10.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State management
  flutter_riverpod: ^3.1.0
  provider: ^6.1.2   # only one provider

  # Networking
  http: ^1.2.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  google_sign_in: ^6.2.2
  image_picker: ^1.2.1

  # UI Widgets
  pin_code_fields: 8.0.1
  sms_autofill: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
